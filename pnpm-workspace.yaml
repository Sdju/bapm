packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@types/node": ^26.1.2
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vitest: 4.1.10
  vite-plus: latest
  vitepress: ^1.6.4
  esbuild: ^0.28.1
  yaml: ^2.9.0
  semver: ^7.8.5
  '@types/semver': ^7.8.0
  fflate: ^0.8.3
  tldts: ^7.4.10
  bumpp: ^11.1.0
overrides:
  # Do not force vite → vite-plus-core globally: VitePress needs stock vite
  # (vite-plus-core rolldown bindings are not linked by plain CI installs).
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
allowBuilds:
  esbuild: true
