name: CI

on:
  pull_request:
  push:
    branches: [master]
  merge_group:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ready:
    name: Check / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Pin exact release; see https://viteplus.dev/guide/ci
      - uses: voidzero-dev/setup-vp@313600b80b104eadebb9111787d37a2e83e014ca # v1.17.0
        with:
          node-version: "22"
          cache: true

      - name: Install
        run: vp install

      # Workspace packages expose types from dist/; typecheck needs a prior build.
      - name: Build packages
        run: vp run -r build

      # Generated agent files are gitignored, so CI materializes them unfrozen.
      - name: Agent config
        run: |
          pnpm run agents:install
          pnpm run agents:check

      - name: Ensure generated agent artifacts are not tracked
        run: |
          tracked=$(git ls-files \
            .agents/skills .agents/rules .agents/mcp_config.json \
            .cursor/agents .cursor/commands .cursor/rules .cursor/hooks \
            .cursor/hooks.json .cursor/bapm-hooks.json .cursor/mcp.json)
          if [ -n "$tracked" ]; then
            echo "Generated agent artifacts must not be tracked:"
            echo "$tracked"
            exit 1
          fi

      - name: Check
        run: vp check

      - name: Test
        run: vp run -r test
        env:
          # GitHub Actions sets CI=true; bapm treats that as lk-018 default-frozen.
          # Suite tests that need CI-frozen set CI themselves; happy-path installs must not.
          CI: ""

      - name: Build docs
        run: vp run --filter @b-apm/docs build
        env:
          # Project Pages path; local/preview keeps "/".
          DOCS_BASE: /${{ github.event.repository.name }}/
