name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready:
    name: Check / test / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Workspace packages expose types from dist/; typecheck needs a prior build.
      - name: Build packages
        run: pnpm run build

      - name: Check
        run: pnpm run check

      - name: Test
        run: pnpm run test
        env:
          # GitHub Actions sets CI=true; bapm treats that as lk-018 default-frozen.
          # Suite tests that need CI-frozen set CI themselves; happy-path installs must not.
          CI: ""

      - name: Build docs
        run: pnpm --filter @bapm/docs build
        env:
          # Project Pages path; local/preview keeps "/".
          DOCS_BASE: /${{ github.event.repository.name }}/
